# =====================================================================
# COMPLETE mapping rules (mandatory + optional): CycloneDX 1.6 -> SPDX 2.3
# Version 3.0.0 - consolidates and supersedes:
#   cyclonedx-1_6-to-spdx-2_3-mandatory.yaml v2.0.0
#   cyclonedx-1_6-to-spdx-2_3-optional.yaml  v2.0.0 (v1.0.0 header, v2 content)
#
# Authority for the mandatory (MAN-) set: Samplemapping.xlsx.
# metadata.component.group remains OPTIONAL (owner decision 2026-08-14).
# Gap authority for this revision: Missing_Fields.xlsx (2026-08-20) plus a
# full path-diff of CDQcyclonedx_1_6.json against rule sourcePaths.
#
# Dialect: Rules_Descriptions_Yaml.xlsx with the agreed extensions
# (owner decisions 2026-08-14 and 2026-08-20):
#   * extra transforms: constant, prefixStrip, idNormalize
#   * sourcePath may be a LIST of paths and may carry [?field=='x'] /
#     [?field in [...]] / [?field not in [...]] filters
#   * sourcePath: null is legal only with transform constant (fabrication)
#   * template.args may name multiple target sub-fields
#   * enumMap.args may include "default"; enumMap table values may be
#     target paths (structured target dispatch)
#   * firstOnly.args may carry a per-branch "formats" map
#   * prohibitFabrication per the rules sheet
#
# CHANGES LOCKED 2026-08-20 (this revision):
#   1. pathAliases REMOVED. Every rule that previously relied on the
#      "metadata.component" alias now lists metadata.component.* paths
#      explicitly in sourcePath. metadata.component maps onto the root
#      package (SPDXRef-RootPackage, referenced by documentDescribes).
#   2. Option A rule-splitting APPLIED. template.args strings contain no
#      function calls. Validation invariant: every {token} in template
#      args must either be an ENGINE VARIABLE - {value}, {field}, {index}
#      - or name a source field declared in the rule's sourcePath.
#      Rules split from one v2.0.0 rule share an xsplitGroup key.
#   3. Sections lost in full now enumerate their IMMEDIATE children in
#      sourcePath (grandchildren are claimed by the listed child).
#   4. Duplicate constant rules deduplicated (MAN- kept, OPT- dropped):
#      spdxVersion, dataLicense, SPDXID, downloadLocation default,
#      vulnerabilities-out-of-scope.
#   5. NEW rules closing verified gaps: MAN-COMPONENT-TYPE-001 (forward
#      components[].type was unmapped - asymmetry with reverse direction),
#      MAN-DOC-DESCRIBES-001 (documentDescribes was never emitted),
#      OPT-METADATA-TOOLS-COMPONENT-DETAIL-LOST-001,
#      OPT-METADATA-TOOLS-SERVICES-LOST-001,
#      OPT-METADATA-CONTACT-DETAIL-LOST-001,
#      OPT-COMPONENT-AUTHOR-DETAIL-LOST-001,
#      OPT-COMPONENT-EXTREF-HASHES-LOST-001,
#      OPT-BOM-ANNOTATION-DETAIL-LOST-001.
#
# STILL OPEN (unchanged by this revision):
#   * authors-XOR-manufacturer at-least-one conditional is inexpressible
#     in the dialect; engine conformance TODO.
#   * "fabricate"-as-rule-key vs "constant"-as-transform schema decision.
#
# Extension keys (x-*) are non-normative; engines must ignore them.
# =====================================================================
ruleSetId: cyclonedx-1.6-to-spdx-2.3
version: 3.0.0
description: Consolidated mandatory + optional rules for the generic SBOM mapping engine, CycloneDX 1.6 source, SPDX 2.3 target. Supersedes the separate v2.0.0 mandatory and optional files.
appliesTo:
  source:
    format: cyclonedx
    version: "1.6"
  target:
    format: spdx
    version: "2.3"
defaults:
  onAbsent: annotate
  onUnmappable: annotate
  defaultSeverityIfLost: MAJOR
  authority: spec
allowedTransforms:
  - identity
  - join
  - template
  - enumMap
  - firstOnly
  - normalizeToSingleLine
  - constant
  - prefixStrip
  - idNormalize
rules:

  # ==================================================================
  # MANDATORY SET (Samplemapping.xlsx authority)
  # ==================================================================

  # ------------------------------------------------------------------
  # Spec-mandatory SPDX document constants (fabricated; no CDX source)
  # ------------------------------------------------------------------
  - ruleId: MAN-DOC-SPDXVERSION-001
    description: spdxVersion is spec-mandatory and fixed.
    sourcePath: null
    targetPath: spdxVersion
    cardinality: one-to-one
    transform: {function: constant, args: {value: "SPDX-2.3"}}
    onAbsent: drop
    onUnmappable: fail
    severityIfLost: BLOCKER
    authority: spec
    prohibitFabrication: false
    xbucket: fabricated
    xfieldsCovered: 0

  - ruleId: MAN-DOC-DATALICENSE-001
    description: 'dataLicense is spec-mandatory and fixed to CC0-1.0 (SPDX 2.3 clause 6.2). It is never a mapping target; a differing BOM licence is a MAJOR loss (OPT-METADATA-LICENSES-LOST-001).'
    sourcePath: null
    targetPath: dataLicense
    cardinality: one-to-one
    transform: {function: constant, args: {value: "CC0-1.0"}}
    onAbsent: drop
    onUnmappable: fail
    severityIfLost: BLOCKER
    authority: spec
    prohibitFabrication: false
    xbucket: fabricated
    xfieldsCovered: 0

  - ruleId: MAN-DOC-SPDXID-001
    sourcePath: null
    targetPath: SPDXID
    cardinality: one-to-one
    transform: {function: constant, args: {value: "SPDXRef-DOCUMENT"}}
    onAbsent: drop
    onUnmappable: fail
    severityIfLost: BLOCKER
    authority: spec
    prohibitFabrication: false
    xbucket: fabricated
    xfieldsCovered: 0

  - ruleId: MAN-DOC-DESCRIBES-001
    description: 'NEW in 3.0.0 - documentDescribes was never emitted by the v2.0.0 files although the root-package convention depends on it. The root package id derives from metadata.component.bom-ref via idNormalize; when bom-ref is absent the engine fabricates SPDXRef-RootPackage and records FABRICATED. Shares the idNormalize symbol table with OPT-COMPONENT-BOMREF-001.'
    sourcePath: metadata.component.bom-ref
    targetPath: documentDescribes[]
    cardinality: one-to-one
    transform:
      function: idNormalize
      args: {format: "SPDXRef-{value}", fallback: "SPDXRef-RootPackage"}
    onAbsent: annotate
    onUnmappable: fail
    severityIfLost: BLOCKER
    authority: spec
    prohibitFabrication: false
    xbucket: native
    xfieldsCovered: 1

  - ruleId: MAN-PKG-DOWNLOADLOCATION-DEFAULT-001
    description: downloadLocation is spec-mandatory on every SPDX package. NOASSERTION is fabricated when no distribution external reference exists (the mapped case is OPT-COMPONENT-EXTREF-DIST-001).
    sourcePath: null
    targetPath: packages[].downloadLocation
    cardinality: one-to-one
    transform: {function: constant, args: {value: "NOASSERTION", onlyWhenAbsent: true}}
    onAbsent: drop
    onUnmappable: fail
    severityIfLost: BLOCKER
    authority: spec
    prohibitFabrication: false
    xbucket: fabricated
    xfieldsCovered: 0

  # ------------------------------------------------------------------
  # Document identity
  # ------------------------------------------------------------------
  - ruleId: MAN-DOC-NAME-001
    description: Map CycloneDX metadata component name to SPDX document name.
    sourcePath: metadata.component.name
    targetPath: name
    cardinality: one-to-one
    transform: {function: identity}
    onAbsent: fail
    onUnmappable: fail
    severityIfLost: BLOCKER
    authority: spec
    prohibitFabrication: true
    xbucket: native
    xfieldsCovered: 1

  - ruleId: MAN-SERIALNUMBER-NAMESPACE-001
    description: 'Sheet row 18. serialNumber (urn:uuid:*) is a valid URI and becomes documentNamespace. documentNamespace is spec-mandatory; when serialNumber is absent the engine fabricates "urn:uuid:{new-uuid}" and records FABRICATED.'
    sourcePath: serialNumber
    targetPath: documentNamespace
    cardinality: one-to-one
    transform: {function: identity}
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    prohibitFabrication: false
    xbucket: native
    xfieldsCovered: 1

  # ------------------------------------------------------------------
  # creationInfo (sheet rows 6, 14, 15, 16, 17)
  # ------------------------------------------------------------------
  - ruleId: MAN-TIMESTAMP-CREATED-001
    description: Sheet row 17. creationInfo.created is spec-mandatory; when metadata.timestamp is absent the engine fabricates the conversion timestamp and records FABRICATED.
    sourcePath: metadata.timestamp
    targetPath: creationInfo.created
    cardinality: one-to-one
    transform: {function: identity}
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    prohibitFabrication: false
    xbucket: native
    xfieldsCovered: 1

  - ruleId: MAN-SUPPLIER-CREATOR-ORG-001
    description: 'Sheet row 6. BOM supplier organization becomes an Organization creator.'
    sourcePath: metadata.supplier.name  
    targetPath: creationInfo.creators[]
    cardinality: one-to-one
    transform:
      function: template
      args: {format: "Organization: {value}"}
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    prohibitFabrication: true
    xbucket: native
    xfieldsCovered: 1


  - ruleId: MAN-MANUFACTURER-CREATOR-ORG-001
    description: 'Sheet row 16, conditional pair with row 14 - manufacturer is mandatory only when metadata.authors is absent.'
    sourcePath: metadata.manufacturer.name
    targetPath: creationInfo.creators[]
    cardinality: one-to-one
    transform:
      function: template
      args: {format: "Organization: {value}"}
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    prohibitFabrication: true
    xbucket: native
    xfieldsCovered: 1


  # ------------------------------------------------------------------
  # Root component -> root package (sheet rows 1, 3, 4, 9).
  # metadata.component serializes as the root package, referenced by
  # documentDescribes (MAN-DOC-DESCRIBES-001).
  # ------------------------------------------------------------------
  - ruleId: MAN-ROOT-NAME-001
    sourcePath: metadata.component.name
    targetPath: packages[].name
    cardinality: one-to-one
    transform: {function: identity}
    onAbsent: fail
    onUnmappable: fail
    severityIfLost: BLOCKER
    authority: spec
    prohibitFabrication: true
    xbucket: native
    xfieldsCovered: 1

  - ruleId: MAN-ROOT-TYPE-001
    description: 'Sheet row 3. Component type maps onto primaryPackagePurpose. primaryPackagePurpose is optional in the SPDX spec; mandatory status is sheet policy. Unlisted CycloneDX types coerce to OTHER.'
    sourcePath: metadata.component.type
    targetPath: packages[].primaryPackagePurpose
    cardinality: one-to-one
    transform:
      function: enumMap
      args:
        table:
          application: APPLICATION
          framework: FRAMEWORK
          library: LIBRARY
          container: CONTAINER
          operating-system: OPERATING_SYSTEM
          device: DEVICE
          device-driver: DEVICE
          firmware: FIRMWARE
          file: FILE
          platform: OTHER
          machine-learning-model: OTHER
          data: OTHER
          cryptographic-asset: OTHER
        default: OTHER
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: house-policy
    prohibitFabrication: true
    xbucket: native
    xfieldsCovered: 1

  - ruleId: MAN-ROOT-VERSION-001
    description: Sheet row 4. versionInfo is optional in the SPDX spec; mandatory status is sheet policy (NTIA minimum).
    sourcePath: metadata.component.version
    targetPath: packages[].versionInfo
    cardinality: one-to-one
    transform: {function: identity}
    onAbsent: annotate
    onUnmappable: fail
    severityIfLost: MAJOR
    authority: house-policy
    prohibitFabrication: true
    xbucket: native
    xfieldsCovered: 1

  - ruleId: MAN-ROOT-PURL-001
    description: 'Sheet row 9. purl becomes a PACKAGE-MANAGER external reference on the root package; SPDX 2.3 has no packages[].purl. referenceCategory and referenceType are rule-supplied constants recorded as FABRICATED sibling values.'
    sourcePath: metadata.component.purl
    targetPath: packages[].externalRefs[]
    cardinality: one-to-one
    transform:
      function: template
      args:
        referenceCategory: "PACKAGE-MANAGER"
        referenceType: "purl"
        referenceLocator: "{value}"
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    prohibitFabrication: true
    xbucket: native
    xfieldsCovered: 1

  # ------------------------------------------------------------------
  # Components -> packages (sheet rows 20, 21, 22, 23)
  # ------------------------------------------------------------------
  - ruleId: MAN-COMPONENT-NAME-001
    sourcePath: components[].name
    targetPath: packages[].name
    cardinality: one-to-many
    transform: {function: identity}
    onAbsent: fail
    onUnmappable: fail
    severityIfLost: BLOCKER
    authority: spec
    prohibitFabrication: true
    xbucket: native
    xfieldsCovered: 1

  - ruleId: MAN-COMPONENT-TYPE-001
    description: 'NEW in 3.0.0 - closes the direction asymmetry found in the 2026-08-20 path diff: the reverse file maps primaryPackagePurpose for EVERY package (MAN-PACKAGE-TYPE-001) but the forward file only mapped the root component type. components[].type is spec-mandatory in CycloneDX, so it is always present on valid input.'
    sourcePath: components[].type
    targetPath: packages[].primaryPackagePurpose
    cardinality: one-to-many
    transform:
      function: enumMap
      args:
        table:
          application: APPLICATION
          framework: FRAMEWORK
          library: LIBRARY
          container: CONTAINER
          operating-system: OPERATING_SYSTEM
          device: DEVICE
          device-driver: DEVICE
          firmware: FIRMWARE
          file: FILE
          platform: OTHER
          machine-learning-model: OTHER
          data: OTHER
          cryptographic-asset: OTHER
        default: OTHER
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: house-policy
    prohibitFabrication: true
    xbucket: native
    xfieldsCovered: 1

  - ruleId: MAN-COMPONENT-VERSION-001
    description: Sheet row 21. Same policy note as MAN-ROOT-VERSION-001.
    sourcePath: components[].version
    targetPath: packages[].versionInfo
    cardinality: one-to-many
    transform: {function: identity}
    onAbsent: annotate
    onUnmappable: fail
    severityIfLost: MAJOR
    authority: house-policy
    prohibitFabrication: true
    xbucket: native
    xfieldsCovered: 1

  - ruleId: MAN-COMPONENT-CPE-001
    description: 'Sheet row 22. cpe becomes a SECURITY external reference. The engine selects cpe22Type when the value starts with "cpe:/", else cpe23Type. 3.0.0 - metadata.component.cpe added (root package; alias removal exposed the gap).'
    sourcePath:
      - "components[].cpe"
      - "metadata.component.cpe"
    targetPath: packages[].externalRefs[]
    cardinality: one-to-many
    transform:
      function: template
      args:
        referenceCategory: "SECURITY"
        referenceType: "cpe23Type"
        referenceLocator: "{value}"
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    prohibitFabrication: true
    xbucket: native
    xfieldsCovered: 2

  - ruleId: MAN-COMPONENT-PURL-001
    description: 'Sheet row 23. purl becomes a PACKAGE-MANAGER external reference on every package.'
    sourcePath: components[].purl
    targetPath: packages[].externalRefs[]
    cardinality: one-to-many
    transform:
      function: template
      args:
        referenceCategory: "PACKAGE-MANAGER"
        referenceType: "purl"
        referenceLocator: "{value}"
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    prohibitFabrication: true
    xbucket: native
    xfieldsCovered: 1

  # ------------------------------------------------------------------
  # Dependency graph. Immediate children (Missing_Fields.xlsx) are now
  # enumerated; "provides" is OPT-DEPENDENCY-PROVIDES-LOST-001.
  # ------------------------------------------------------------------
  - ruleId: MAN-DEPENDENCY-001
    description: 'Rewritten in 3.0.0 (was an underspecified identity rule). Each ref/dependsOn edge becomes a DEPENDS_ON relationship. bom-ref endpoints are rewritten to SPDXRef ids through the idNormalize symbol table maintained by OPT-COMPONENT-BOMREF-001 (RENAMED events).'
    sourcePath:
      - "dependencies[].ref"
      - "dependencies[].dependsOn[]"
    targetPath: relationships[]
    cardinality: one-to-many
    transform:
      function: template
      args:
        spdxElementId: "{ref}"
        relationshipType: "DEPENDS_ON"
        relatedSpdxElement: "{dependsOn}"
    onAbsent: drop
    onUnmappable: fail
    severityIfLost: BLOCKER
    authority: spec
    prohibitFabrication: true
    xbucket: native
    xfieldsCovered: 2

  # ------------------------------------------------------------------
  # Vulnerabilities: out of scope. Immediate children enumerated per
  # Missing_Fields.xlsx (deduplicates v2.0.0 OPT-VULNERABILITIES-LOST-001).
  # ------------------------------------------------------------------
  - ruleId: MAN-VULNERABILITY-OUT-OF-SCOPE-001
    sourcePath:
      - "vulnerabilities[].bom-ref"
      - "vulnerabilities[].id"
      - "vulnerabilities[].source"
      - "vulnerabilities[].references[]"
      - "vulnerabilities[].ratings[]"
      - "vulnerabilities[].cwes[]"
      - "vulnerabilities[].description"
      - "vulnerabilities[].detail"
      - "vulnerabilities[].recommendation"
      - "vulnerabilities[].workaround"
      - "vulnerabilities[].proofOfConcept"
      - "vulnerabilities[].advisories[]"
      - "vulnerabilities[].created"
      - "vulnerabilities[].published"
      - "vulnerabilities[].updated"
      - "vulnerabilities[].rejected"
      - "vulnerabilities[].credits"
      - "vulnerabilities[].tools"
      - "vulnerabilities[].analysis"
      - "vulnerabilities[].affects[]"
      - "vulnerabilities[].properties[]"
    targetPath: null
    cardinality: none
    transform: {function: identity}
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    lossReason: VEX/vulnerability data (51 leaf fields) is outside the scoped SPDX 2.3 mapping; SPDX handles security via external references only.
    prohibitFabrication: true
    xbucket: lost
    xfieldsCovered: 51

  # ==================================================================
  # OPTIONAL SET
  # ==================================================================

  # ------------------------------------------------------------------
  # Document level: mapped
  # ------------------------------------------------------------------
  - ruleId: OPT-BOM-EXTDOC-URL-001
    description: 'Option A split of v2.0.0 OPT-BOM-EXTREF-BOM-001. BOM-level external reference of type "bom" becomes an externalDocumentRef. externalDocumentId is engine-numbered via the {index} engine variable.'
    sourcePath: externalReferences[?type=='bom'].url
    targetPath: externalDocumentRefs[]
    cardinality: one-to-many
    transform:
      function: template
      args:
        spdxDocument: "{value}"
        externalDocumentId: "DocumentRef-{index}"
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    xsplitGroup: bom-extdoc
    xbucket: native
    xfieldsCovered: 2

  - ruleId: OPT-BOM-EXTDOC-CHECKSUM-ALG-001
    description: 'Option A split. Hash algorithm of the bom-type external reference maps into the externalDocumentRef checksum. SPDX requires exactly one checksum per externalDocumentRef; extras are TRUNCATED.'
    sourcePath: externalReferences[?type=='bom'].hashes[].alg
    targetPath: externalDocumentRefs[].checksum.algorithm
    cardinality: one-to-one
    transform:
      function: enumMap
      args:
        table:
          MD5: MD5
          SHA-1: SHA1
          SHA-256: SHA256
          SHA-384: SHA384
          SHA-512: SHA512
          SHA3-256: SHA3-256
          SHA3-384: SHA3-384
          SHA3-512: SHA3-512
          BLAKE2b-256: BLAKE2b-256
          BLAKE2b-384: BLAKE2b-384
          BLAKE2b-512: BLAKE2b-512
          BLAKE3: BLAKE3
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MINOR
    authority: spec
    xsplitGroup: bom-extdoc
    xbucket: native
    xfieldsCovered: 1

  - ruleId: OPT-BOM-EXTDOC-CHECKSUM-VALUE-001
    description: Option A split. Hash content of the bom-type external reference.
    sourcePath: externalReferences[?type=='bom'].hashes[].content
    targetPath: externalDocumentRefs[].checksum.checksumValue
    cardinality: one-to-one
    transform: {function: identity}
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MINOR
    authority: spec
    xsplitGroup: bom-extdoc
    xbucket: native
    xfieldsCovered: 1

  # --- BOM annotations (Option A split of v2.0.0 OPT-BOM-ANNOTATIONS-001)
  - ruleId: OPT-BOM-ANNOTATION-ANNOTATOR-001
    description: 'CycloneDX annotator alternatives collapse into the single prefixed SPDX annotator string - organization -> "Organization: ", individual -> "Person: ", component/service refs -> "Tool: " (MODIFIED).'
    sourcePath:
      - "annotations[].annotator.organization.name"
      - "annotations[].annotator.individual.name"
      - "annotations[].annotator.component.name"
      - "annotations[].annotator.service.name"
    targetPath: annotations[].annotator
    cardinality: many-to-one
    transform:
      function: firstOnly
      args:
        formats:
          organization: "Organization: {value}"
          individual: "Person: {value}"
          component: "Tool: {value}"
          service: "Tool: {value}"
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MINOR
    authority: spec
    xsplitGroup: bom-annotations
    xbucket: native
    xfieldsCovered: 4

  - ruleId: OPT-BOM-ANNOTATION-DATE-001
    sourcePath: annotations[].timestamp
    targetPath: annotations[].annotationDate
    cardinality: one-to-one
    transform: {function: identity}
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MINOR
    authority: spec
    xsplitGroup: bom-annotations
    xbucket: native
    xfieldsCovered: 1

  - ruleId: OPT-BOM-ANNOTATION-TEXT-001
    sourcePath: annotations[].text
    targetPath: annotations[].comment
    cardinality: one-to-one
    transform: {function: identity}
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MINOR
    authority: spec
    xsplitGroup: bom-annotations
    xbucket: native
    xfieldsCovered: 1

  - ruleId: OPT-BOM-ANNOTATION-TYPE-CONST-001
    description: SPDX annotationType is mandatory on every annotation; CycloneDX has no equivalent, so OTHER is fabricated.
    sourcePath: null
    targetPath: annotations[].annotationType
    cardinality: one-to-one
    transform: {function: constant, args: {value: "OTHER"}}
    onAbsent: drop
    onUnmappable: fail
    severityIfLost: MINOR
    authority: spec
    xsplitGroup: bom-annotations
    xbucket: fabricated
    xfieldsCovered: 0

  # Annotation placement is handled structurally by the engine: each CycloneDX annotation's
  # subjects[] bom-refs are resolved against the package symbol table and the finished annotation
  # object is reparented onto every referenced package (annotations whose subjects resolve to no
  # package - e.g. services - remain on the document). This replaces the former
  # OPT-BOM-ANNOTATION-SUBJECTS-001 mapping, which materialised empty placeholder packages.

  - ruleId: OPT-BOM-PROPERTIES-001
    description: Root- and metadata-level property name/value pairs are preserved (degraded) as a joined document comment.
    sourcePath:
      - "properties[].name"
      - "properties[].value"
      - "metadata.properties[].name"
      - "metadata.properties[].value"
    targetPath: comment
    cardinality: many-to-one
    transform:
      function: join
      args: {itemFormat: "{name}={value}", separator: "; ", prefix: "cyclonedx:properties "}
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MINOR
    authority: house-policy
    xbucket: degraded
    xfieldsCovered: 5

  - ruleId: OPT-METADATA-TOOL-DETAIL-001
    description: 'Tool group/version join into the mandatory creator string ("Tool: {group}-{name}-{version}"). 3.0.0 fix - name added to sourcePath; the template referenced it undeclared (sibling-field defect).'
    sourcePath:
      - "metadata.tools.components[].name"
      - "metadata.tools.components[].version"
      - "metadata.tools.components[].group"
    targetPath: creationInfo.creators[]
    cardinality: many-to-one
    transform:
      function: template
      args: {format: "Tool: {group}-{name}-{version}"}
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MINOR
    authority: house-policy
    xbucket: native
    xfieldsCovered: 3

  - ruleId: OPT-METADATA-AUTHOR-EMAIL-001
    description: 'Author e-mail joins into the mandatory Person creator string. 3.0.0 fix - name added to sourcePath (sibling-field defect).'
    sourcePath:
      - "metadata.authors[].name"
      - "metadata.authors[].email"
    targetPath: creationInfo.creators[]
    cardinality: many-to-one
    transform:
      function: template
      args: {format: "Person: {name} ({email})"}
    onAbsent: drop
    onUnmappable: annotate
