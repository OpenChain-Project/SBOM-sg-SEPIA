# =====================================================================
# COMPLETE mapping rules (mandatory + optional): SPDX 2.3 -> CycloneDX 1.6
# Version 3.0.0 - consolidates and supersedes:
#   spdx-2_3-to-cyclonedx-1_6-mandatory.yaml v2.0.0
#   spdx-2_3-to-cyclonedx-1_6-optional.yaml  v2.0.0 (v1.0.0 header, v2 content)
#
# Authority for the mandatory (MAN-) set: Samplemapping.xlsx read in
# reverse. Gap authority for this revision: Missing_Fields.xlsx
# (2026-08-20) plus a full path-diff of CDQspdx_2_3_schema.json against
# rule sourcePaths.
#
# Dialect: Rules_Descriptions_Yaml.xlsx with the agreed extensions
# (owner decisions 2026-08-14 and 2026-08-20) - see the forward file
# header for the full list.
#
# CHANGES LOCKED 2026-08-20 (this revision):
#   1. Option A rule-splitting APPLIED. template.args strings contain no
#      function calls. Validation invariant: every {token} in template
#      args must either be an ENGINE VARIABLE - {value}, {field}, {index}
#      - or name a source field declared in the rule's sourcePath.
#      Rules split from one v2.0.0 rule share an xsplitGroup key.
#      Split rules replace: OPT-SPDX-DOC-ANNOTATIONS-001,
#      OPT-SPDX-PKG-EXTREF-OTHER-001, OPT-SPDX-PKG-ANNOTATIONS-001,
#      OPT-SPDX-PKG-ORIGINATOR-001, OPT-SPDX-FILE-CORE-001,
#      OPT-SPDX-FILE-ANNOTATIONS-001, OPT-SPDX-EXTRACTEDLIC-001,
#      OPT-SPDX-EXTDOCREF-001, MAN-RELATIONSHIP-DEPENDENCY-001.
#   2. Sections lost in full now enumerate their IMMEDIATE children in
#      sourcePath (revieweds, snippets - per Missing_Fields.xlsx).
#   3. Duplicate rules deduplicated (MAN- kept, OPT- dropped):
#      bomFormat, specVersion, version constants; DEPENDS_ON/
#      DEPENDENCY_OF relationship mapping (was in both files).
#   4. NEW coverage: SPDX document "name" now degrades to the property
#      spdx:document:name (it had no reverse rule at all - path diff).
#   5. Sibling-field defect fixed: OPT-SPDX-EXTRACTEDLIC-COMMENT-
#      DEGRADED-001 now declares licenseId in sourcePath.
#   6. Reference rewriting: OPT-SPDX-PKG-SPDXID-001 registers the
#      SPDXID -> bom-ref table; relationship/annotation/dependency
#      endpoints are rewritten through it (RENAMED events).
#
# CycloneDX validity notes:
#   * bomFormat, specVersion, version are spec-mandatory -> constants.
#   * components[].type is spec-mandatory on EVERY component; mapped
#     from primaryPackagePurpose where present, else fabricated as
#     "library" (house-policy, FABRICATED event).
#   * CDQ SCHEMA FINDING (2026-08-20): CDQcyclonedx_1_6.json marks
#     "version" AND "purl" required on every component (stricter than
#     upstream CycloneDX 1.6). A package with no versionInfo or no purl
#     external reference therefore converts to a CDQ-schema-invalid
#     component. Both rules keep prohibitFabrication: true - the loss
#     is recorded MAJOR instead of inventing identity data. Owner
#     decision needed if CDQ validity must be guaranteed.
#   * serialNumber must match urn:uuid:*; a documentNamespace that is
#     not a urn:uuid URI is unmappable and a fresh serial is fabricated.
#
# STILL OPEN (unchanged by this revision):
#   * authors-XOR-manufacturer conditional (engine conformance TODO).
#   * "fabricate"-as-rule-key vs "constant"-as-transform decision.
#
# Extension keys (x-*) are non-normative; engines must ignore them.
# =====================================================================
ruleSetId: spdx-2.3-to-cyclonedx-1.6
version: 3.0.2
description: Consolidated mandatory + optional rules for the generic SBOM mapping engine, SPDX 2.3 source, CycloneDX 1.6 target. Supersedes the separate v2.0.0 mandatory and optional files.
appliesTo:
  source:
    format: spdx
    version: "2.3"
  target:
    format: cyclonedx
    version: "1.6"
defaults:
  onAbsent: annotate
  onUnmappable: annotate
  defaultSeverityIfLost: MAJOR
  authority: spec
allowedTransforms:
  - identity
  - join
  - template
  - enumMap
  - firstOnly
  - normalizeToSingleLine
  - constant
  - prefixStrip
  - idNormalize
  - uuidExtract
rules:

  # ==================================================================
  # MANDATORY SET (Samplemapping.xlsx authority, reversed)
  # ==================================================================

  # ------------------------------------------------------------------
  # Spec-mandatory CycloneDX document constants (fabricated)
  # ------------------------------------------------------------------
  - ruleId: MAN-CDX-BOMFORMAT-001
    sourcePath: null
    targetPath: bomFormat
    cardinality: one-to-one
    transform: {function: constant, args: {value: "CycloneDX"}}
    onAbsent: drop
    onUnmappable: fail
    severityIfLost: BLOCKER
    authority: spec
    prohibitFabrication: false
    xbucket: fabricated

  - ruleId: MAN-CDX-SPECVERSION-001
    sourcePath: null
    targetPath: specVersion
    cardinality: one-to-one
    transform: {function: constant, args: {value: "1.6"}}
    onAbsent: drop
    onUnmappable: fail
    severityIfLost: BLOCKER
    authority: spec
    prohibitFabrication: false
    xbucket: fabricated

  - ruleId: MAN-CDX-BOMVERSION-001
    description: SPDX 2.3 has no document-revision field, so the BOM revision is fixed at 1.
    sourcePath: null
    targetPath: version
    cardinality: one-to-one
    transform: {function: constant, args: {value: 1}}
    onAbsent: drop
    onUnmappable: fail
    severityIfLost: MINOR
    authority: spec
    prohibitFabrication: false
    xbucket: fabricated

  # ------------------------------------------------------------------
  # Document identity (sheet rows 17, 18)
  # ------------------------------------------------------------------
  - ruleId: MAN-CREATED-TIMESTAMP-001
    description: Sheet row 17. creationInfo.created is spec-mandatory in SPDX, so onAbsent indicates an invalid source document.
    sourcePath: creationInfo.created
    targetPath: metadata.timestamp
    cardinality: one-to-one
    transform: {function: identity}
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    prohibitFabrication: true
    xbucket: native

  - ruleId: MAN-NAMESPACE-SERIALNUMBER-001
    description: 'Sheet row 18. serialNumber must match urn:uuid:<uuid>. uuidExtract pulls the RFC 4122 UUID embedded in documentNamespace (e.g. http://spdx.org/spdxdocs/example-444504E0-4F89-41D3-9A0C-0305E82C3301) and reshapes it as urn:uuid:<uuid> (MODIFIED); a namespace already in urn:uuid form passes through unchanged; a namespace carrying no UUID has a fresh urn:uuid serial fabricated (FABRICATED), the original namespace captured in the loss event (recordSourceValue).'
    sourcePath: documentNamespace
    targetPath: serialNumber
    cardinality: one-to-one
    transform: {function: uuidExtract, args: {format: "urn:uuid:{value}", onNoMatch: fabricate}}
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    prohibitFabrication: false
    xbucket: native

  # ------------------------------------------------------------------
  # creators -> metadata (sheet rows 6, 14, 15, 16)
  # ------------------------------------------------------------------
  - ruleId: MAN-CREATOR-ORG-SUPPLIER-001
    description: 'Sheet row 6. The Organization creator becomes the BOM supplier organisation.'
    sourcePath: "creationInfo.creators[?startsWith 'Organization: ']"
    targetPath: metadata.supplier.name
    cardinality: one-to-one
    transform:
      function: prefixStrip
      args: {prefix: "Organization: "}
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    prohibitFabrication: true
    xbucket: native

  - ruleId: MAN-CREATOR-PERSON-AUTHORS-001
    description: 'Sheet row 14, conditional pair with row 16. Person creators become BOM authors. A trailing "(email)" stays inside the name string (MODIFIED); e-mail splitting is not expressible with the agreed transforms.'
    sourcePath: "creationInfo.creators[?startsWith 'Person: ']"
    targetPath: metadata.authors[].name
    cardinality: one-to-many
    transform:
      function: prefixStrip
      args: {prefix: "Person: "}
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    prohibitFabrication: true
    xbucket: native

  - ruleId: MAN-CREATOR-ORG-MANUFACTURER-001
    description: 'Sheet row 16, conditional pair with row 14 - emitted only when no Person creator exists (engine-evaluated condition; this dialect has no conditional construct). Duplicates the Organization creator into metadata.manufacturer for automation-generated BOMs.'
    sourcePath: "creationInfo.creators[?startsWith 'Organization: ']"
    targetPath: metadata.manufacturer.name
    cardinality: one-to-one
    transform:
      function: prefixStrip
      args: {prefix: "Organization: "}
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: house-policy
    prohibitFabrication: true
    xbucket: native

  - ruleId: MAN-CREATOR-TOOL-TOOLS-001
    description: 'Sheet row 15. Tool creators become metadata.tools.components entries. The whole "name-version" token is kept as the component name (MODIFIED); reliable splitting is not possible because tool names may contain hyphens. Note - metadataToolsComponent requires only "name" in the CDQ schema, so no type constant is fabricated.'
    sourcePath: "creationInfo.creators[?startsWith 'Tool: ']"
    targetPath: metadata.tools.components[].name
    cardinality: one-to-many
    transform:
      function: prefixStrip
      args: {prefix: "Tool: "}
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    prohibitFabrication: true
    xbucket: native

  # ------------------------------------------------------------------
  # Root package -> metadata.component (sheet rows 1, 3, 4, 9).
  # "The root package" = the package referenced by documentDescribes
  # (or the target of a DESCRIBES relationship); REPARENTED. The first
  # documentDescribes entry that resolves to an existing package is used,
  # so a dangling reference at documentDescribes[0] does not suppress it.
  # ------------------------------------------------------------------
  - ruleId: MAN-ROOT-NAME-001
    description: Sheet row 1.
    sourcePath: "packages[?SPDXID in documentDescribes].name"
    targetPath: metadata.component.name
    cardinality: one-to-one
    transform: {function: identity}
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: BLOCKER
    authority: spec
    prohibitFabrication: true
    xbucket: native

  - ruleId: MAN-ROOT-BOMREF-001
    description: 'The described (root) package''s SPDXID becomes metadata.component.bom-ref after SPDXRef- strip, mirroring OPT-SPDX-PKG-SPDXID-001 for ordinary components and keeping dependency/relationship endpoints resolvable to the root component.'
    sourcePath: "packages[?SPDXID in documentDescribes].SPDXID"
    targetPath: metadata.component.bom-ref
    cardinality: one-to-one
    transform:
      function: prefixStrip
      args: {prefix: "SPDXRef-"}
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    prohibitFabrication: true
    xbucket: native

  - ruleId: MAN-ROOT-DOCUMENTDESCRIBES-001
    sourcePath: documentDescribes[]
    targetPath: metadata.properties[]
    cardinality: one-to-many
    transform:
      function: template
      args: {name: "spdx:file:{field}", value: "{value}"}
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MINOR
    authority: spec
    xbucket: native
    xfieldsCovered: 1

  - ruleId: MAN-ROOT-TYPE-001
    description: 'Sheet row 3. primaryPackagePurpose maps onto the spec-mandatory component type. SOURCE/ARCHIVE/INSTALL/OTHER have no CycloneDX counterpart and coerce per house policy.'
    sourcePath: "packages[?SPDXID in documentDescribes].primaryPackagePurpose"
    targetPath: metadata.component.type
    cardinality: one-to-one
    transform:
      function: enumMap
      args:
        table:
          APPLICATION: application
          FRAMEWORK: framework
          LIBRARY: library
          CONTAINER: container
          OPERATING_SYSTEM: operating-system
          DEVICE: device
          FIRMWARE: firmware
          FILE: file
          SOURCE: library
          ARCHIVE: file
          INSTALL: application
          OTHER: library
        default: library
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: house-policy
    prohibitFabrication: false
    xbucket: native

  - ruleId: MAN-ROOT-VERSION-001
    description: Sheet row 4. See CDQ SCHEMA FINDING in the header - version is required on every CDQ component.
    sourcePath: "packages[?SPDXID in documentDescribes].versionInfo"
    targetPath: metadata.component.version
    cardinality: one-to-one
    transform: {function: identity}
    onAbsent: annotate
    onUnmappable: fail
    severityIfLost: MAJOR
    authority: house-policy
    prohibitFabrication: true
    xbucket: native

  - ruleId: MAN-ROOT-PURL-001
    description: Sheet row 9. The purl external reference of the root package returns to the first-class purl field. See CDQ SCHEMA FINDING - purl is required on every CDQ component; absence is a MAJOR loss, not fabricated.
    sourcePath: "packages[?SPDXID in documentDescribes].externalRefs[?referenceType=='purl'].referenceLocator"
    targetPath: metadata.component.purl
    cardinality: one-to-one
    transform: {function: firstOnly}
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    prohibitFabrication: true
    xbucket: native

  # ------------------------------------------------------------------
  # Packages -> components (sheet rows 20, 21, 22, 23)
  # ------------------------------------------------------------------
  - ruleId: MAN-PACKAGE-NAME-001
    sourcePath: packages[].name
    targetPath: components[].name
    cardinality: one-to-many
    transform: {function: identity}
    onAbsent: fail
    onUnmappable: fail
    severityIfLost: BLOCKER
    authority: spec
    prohibitFabrication: true
    xbucket: native

  - ruleId: MAN-PACKAGE-VERSION-001
    description: Sheet row 21. versionInfo is optional in the SPDX spec, so absence is annotated rather than failed. See CDQ SCHEMA FINDING - the resulting component is CDQ-schema-invalid without it.
    sourcePath: packages[].versionInfo
    targetPath: components[].version
    cardinality: one-to-many
    transform: {function: identity}
    onAbsent: annotate
    onUnmappable: fail
    severityIfLost: MAJOR
    authority: house-policy
    prohibitFabrication: true
    xbucket: native

  - ruleId: MAN-PACKAGE-TYPE-001
    description: 'primaryPackagePurpose maps onto the spec-mandatory components[].type for every package (sheet row 3 names only the root, but CycloneDX requires type everywhere). Paired with the fabrication default below.'
    sourcePath: packages[].primaryPackagePurpose
    targetPath: components[].type
    cardinality: one-to-many
    transform:
      function: enumMap
      args:
        table:
          APPLICATION: application
          FRAMEWORK: framework
          LIBRARY: library
          CONTAINER: container
          OPERATING_SYSTEM: operating-system
          DEVICE: device
          FIRMWARE: firmware
          FILE: file
          SOURCE: library
          ARCHIVE: file
          INSTALL: application
          OTHER: library
        default: library
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: house-policy
    prohibitFabrication: false
    xbucket: native

  - ruleId: MAN-PACKAGE-TYPE-DEFAULT-001
    description: 'components[].type is spec-mandatory in CycloneDX. When a package carries no primaryPackagePurpose the engine fabricates "library" and records FABRICATED.'
    sourcePath: null
    targetPath: components[].type
    cardinality: one-to-one
    transform: {function: constant, args: {value: "library", onlyWhenAbsent: true}}
    onAbsent: drop
    onUnmappable: fail
    severityIfLost: BLOCKER
    authority: house-policy
    prohibitFabrication: false
    xbucket: fabricated

  - ruleId: MAN-PACKAGE-CPE-001
    description: 'Sheet row 22. Both cpe23Type and cpe22Type locators return to the single components[].cpe field; when both exist the 2.3 form wins (firstOnly on the filter order) and the loser is recorded TRUNCATED.'
    sourcePath:
      - "packages[].externalRefs[?referenceCategory=='SECURITY'].referenceLocator"
    targetPath: components[].cpe
    cardinality: one-to-many
    transform: {function: firstOnly}
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    prohibitFabrication: true
    xbucket: native

  - ruleId: MAN-PACKAGE-EXTERNALREFS-001
    sourcePath: packages[].externalRefs[].referenceLocator
    targetPath: components[].properties[]
    cardinality: one-to-many
    transform:
      function: template
      args: {name: "spdx:file:{field}", value: "{value}"}
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    xbucket: native
    xfieldsCovered: 1    

  - ruleId: MAN-PACKAGE-PURL-001
    description: Sheet rows 9/23. See CDQ SCHEMA FINDING - purl is required on every CDQ component; absence is a MAJOR loss, not fabricated.
    sourcePath: "packages[].externalRefs[?referenceType=='purl'].referenceLocator"
    targetPath: components[].purl
    cardinality: one-to-many
    transform: {function: firstOnly}
    onAbsent: annotate
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    prohibitFabrication: true
    xbucket: native

  # ------------------------------------------------------------------
  # Dependency graph (Option A split of MAN-RELATIONSHIP-DEPENDENCY-001;
  # deduplicates OPT-SPDX-REL-DEPENDS-001, which restated it).
  # Endpoint ids are rewritten SPDXRef -> bom-ref through the table
  # registered by OPT-SPDX-PKG-SPDXID-001 (RENAMED).
  #
  # 3.0.2 - all dependency-like SPDX relationship types now feed the
  # CycloneDX dependencies[] graph (owner decision 2026-09-03), not just
  # DEPENDS_ON/DEPENDENCY_OF. Direct-link forms (DEPENDS_ON, DYNAMIC_LINK,
  # STATIC_LINK) are forward edges (spdxElementId depends on
  # relatedSpdxElement); the *_OF forms (DEPENDENCY_OF, TEST_DEPENDENCY_OF,
  # BUILD_DEPENDENCY_OF, DEV_DEPENDENCY_OF, OPTIONAL_DEPENDENCY_OF,
  # PROVIDED_DEPENDENCY_OF, RUNTIME_DEPENDENCY_OF) are inverted edges
  # (relatedSpdxElement depends on spdxElementId).
  # ------------------------------------------------------------------
  - ruleId: MAN-RELATIONSHIP-DEPENDSON-001
    description: 'Each direct-link relationship (DEPENDS_ON, DYNAMIC_LINK, STATIC_LINK) becomes a forward dependency edge: spdxElementId depends on relatedSpdxElement. The engine merges edges sharing the same ref into one dependencies[] entry.'
    sourcePath:
      - "relationships[?relationshipType in ['DEPENDS_ON','DYNAMIC_LINK','STATIC_LINK']].spdxElementId"
      - "relationships[?relationshipType in ['DEPENDS_ON','DYNAMIC_LINK','STATIC_LINK']].relatedSpdxElement"
    targetPath: dependencies[]
    cardinality: one-to-many
    transform:
      function: template
      args:
        ref: "{spdxElementId}"
        dependsOn: "[{relatedSpdxElement}]"
    onAbsent: drop
    onUnmappable: fail
    severityIfLost: BLOCKER
    authority: spec
    prohibitFabrication: true
    xsplitGroup: relationship-dependency
    xbucket: native

  - ruleId: MAN-RELATIONSHIP-DEPENDENCYOF-001
    description: 'Each *_OF relationship (DEPENDENCY_OF, TEST_DEPENDENCY_OF, BUILD_DEPENDENCY_OF, DEV_DEPENDENCY_OF, OPTIONAL_DEPENDENCY_OF, PROVIDED_DEPENDENCY_OF, RUNTIME_DEPENDENCY_OF) is inverted into a dependency edge: relatedSpdxElement depends on spdxElementId (REPARENTED).'
    sourcePath:
      - "relationships[?relationshipType in ['DEPENDENCY_OF','TEST_DEPENDENCY_OF','BUILD_DEPENDENCY_OF','DEV_DEPENDENCY_OF','OPTIONAL_DEPENDENCY_OF','PROVIDED_DEPENDENCY_OF','RUNTIME_DEPENDENCY_OF']].spdxElementId"
      - "relationships[?relationshipType in ['DEPENDENCY_OF','TEST_DEPENDENCY_OF','BUILD_DEPENDENCY_OF','DEV_DEPENDENCY_OF','OPTIONAL_DEPENDENCY_OF','PROVIDED_DEPENDENCY_OF','RUNTIME_DEPENDENCY_OF']].relatedSpdxElement"
    targetPath: dependencies[]
    cardinality: one-to-many
    transform:
      function: template
      args:
        ref: "{relatedSpdxElement}"
        dependsOn: "[{spdxElementId}]"
    onAbsent: drop
    onUnmappable: fail
    severityIfLost: BLOCKER
    authority: spec
    prohibitFabrication: true
    xsplitGroup: relationship-dependency
    xbucket: native

  # ==================================================================
  # OPTIONAL SET
  # ==================================================================

  # ------------------------------------------------------------------
  # Document level: mapped
  # ------------------------------------------------------------------
  - ruleId: OPT-SPDX-DATALICENSE-001
    description: dataLicense (always CC0-1.0) is representable as the license of the BOM itself.
    sourcePath: dataLicense
    targetPath: metadata.licenses[].license.id
    cardinality: one-to-one
    transform: {function: identity}
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MINOR
    authority: house-policy
    xbucket: native
    xfieldsCovered: 1

  # --- External document refs (Option A split of OPT-SPDX-EXTDOCREF-001)
  - ruleId: OPT-SPDX-EXTDOCREF-URL-001
    description: External document references become BOM-type external references; the documentRef id is preserved in the comment.
    sourcePath:
      - "externalDocumentRefs[].spdxDocument"
      - "externalDocumentRefs[].externalDocumentId"
    targetPath: externalReferences[]
    cardinality: one-to-many
    transform:
      function: template
      args:
        type: "bom"
        url: "{spdxDocument}"
        comment: "{externalDocumentId}"
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    xsplitGroup: extdocref
    xbucket: native
    xfieldsCovered: 2

  - ruleId: OPT-SPDX-EXTDOCREF-HASH-ALG-001
    description: Option A split. Checksum algorithm of the external document ref becomes the hash algorithm of the bom-type external reference.
    sourcePath: externalDocumentRefs[].checksum.algorithm
    targetPath: externalReferences[].hashes[].alg
    cardinality: one-to-one
    transform:
      function: enumMap
      args:
        table:
          MD5: MD5
          SHA1: SHA-1
          SHA256: SHA-256
          SHA384: SHA-384
          SHA512: SHA-512
          SHA3-256: SHA3-256
          SHA3-384: SHA3-384
          SHA3-512: SHA3-512
          BLAKE2b-256: BLAKE2b-256
          BLAKE2b-384: BLAKE2b-384
          BLAKE2b-512: BLAKE2b-512
          BLAKE3: BLAKE3
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MINOR
    authority: spec
    xsplitGroup: extdocref
    xbucket: native
    xfieldsCovered: 1

  - ruleId: OPT-SPDX-EXTDOCREF-HASH-VALUE-001
    description: Option A split. Checksum value of the external document ref.
    sourcePath: externalDocumentRefs[].checksum.checksumValue
    targetPath: externalReferences[].hashes[].content
    cardinality: one-to-one
    transform: {function: identity}
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MINOR
    authority: spec
    xsplitGroup: extdocref
    xbucket: native
    xfieldsCovered: 1

  # OPT-SPDX-DESCRIBES-001 removed: the described (root) package is REPARENTED to
  # metadata.component as an object by the MAN-ROOT-* rules above (which read the
  # described package via `packages[?SPDXID in documentDescribes]`). The former rule
  # wrote the raw documentDescribes SPDXID as a scalar to metadata.component, which
  # produced an invalid string value and clobbered that object.

  # --- Document annotations (Option A split of OPT-SPDX-DOC-ANNOTATIONS-001)
  - ruleId: OPT-SPDX-DOC-ANNOTATION-ANNOTATOR-001
    description: 'The prefixed SPDX annotator string is stripped; the matched prefix selects the CycloneDX annotator alternative - "Person: " -> annotator.individual.name, "Organization: " -> annotator.organization.name, "Tool: " -> annotator.service.name (MODIFIED). Sub-key selection by matched prefix is documented prefixStrip engine semantics.'
    sourcePath: annotations[].annotator
    targetPath: annotations[].annotator
    cardinality: one-to-many
    transform:
      function: prefixStrip
      args:
        prefixMap:
          "Person: ": individual.name
          "Organization: ": organization.name
          "Tool: ": service.name
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MINOR
    authority: spec
    xsplitGroup: doc-annotations
    xbucket: native
    xfieldsCovered: 1

  - ruleId: OPT-SPDX-DOC-ANNOTATION-TIMESTAMP-001
    sourcePath: annotations[].annotationDate
    targetPath: annotations[].timestamp
    cardinality: one-to-one
    transform: {function: identity}
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MINOR
    authority: spec
    xsplitGroup: doc-annotations
    xbucket: native
    xfieldsCovered: 1

  - ruleId: OPT-SPDX-DOC-ANNOTATION-TEXT-001
    description: annotationType has no CycloneDX field and is folded into the text prefix (MODIFIED).
    sourcePath:
