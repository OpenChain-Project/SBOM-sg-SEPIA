  # ------------------------------------------------------------------
  - ruleId: OPT-SPDX-REL-STRUCTURAL-001
    description: 'Applied by the engine post-processor (SPDX source + CycloneDX target). 3.0.3 - all structural relationships are recorded flat as a spdx:relationship:<TYPE> property (no tree restructuring, so bom-refs stay unique). CONTAINS/CONTAINED_BY keep the spdx:relationship:contains property on the parent component; ANCESTOR_OF/DESCENDANT_OF/VARIANT_OF/DESCRIBES/DESCRIBED_BY are recorded as a spdx:relationship:<TYPE> property on the spdxElementId component, valued with the relatedSpdxElement bom-ref. DESCRIBES/DESCRIBED_BY are ALSO covered by the MAN-ROOT-* rules (metadata.component), which are unchanged. Endpoint ids are rewritten SPDXRef- -> bom-ref.'
    sourcePath: "relationships[?relationshipType in ['CONTAINS','CONTAINED_BY','ANCESTOR_OF','DESCENDANT_OF','VARIANT_OF','DESCRIBES','DESCRIBED_BY']]"
    targetPath:
      - "components[].properties[]"
      - "metadata.component"
    cardinality: one-to-many
    transform:
      function: enumMap
      args:
        field: relationshipType
        table:
          CONTAINS: components[].properties[]
          CONTAINED_BY: components[].properties[]
          ANCESTOR_OF: components[].properties[]
          DESCENDANT_OF: components[].properties[]
          VARIANT_OF: components[].properties[]
          DESCRIBES: components[].properties[]
          DESCRIBED_BY: components[].properties[]
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    xbucket: native
    xfieldsCovered: 1

  - ruleId: OPT-SPDX-REL-OTHER-001
    description: 'Applied by the engine post-processor (SPDX source + CycloneDX target). 3.0.4 - the remaining non-dependency, non-containment SPDX relationship types (BUILD_TOOL_OF, GENERATES, TEST_OF, TEST_CASE_OF, AMENDS, COPY_OF, PATCH_FOR, ...) are no longer lost; like the structural rule, each is recorded flat as a spdx:relationship:<TYPE> property on the spdxElementId component, valued with the relatedSpdxElement bom-ref (endpoint ids rewritten SPDXRef- -> bom-ref). Dependency-like types (DEPENDS_ON/DYNAMIC_LINK/STATIC_LINK and the *_OF-dependency forms) instead feed dependencies[]; CONTAINS/CONTAINED_BY/ANCESTOR_OF/DESCENDANT_OF/VARIANT_OF/DESCRIBES/DESCRIBED_BY are handled by OPT-SPDX-REL-STRUCTURAL-001. Relationship comments remain lost (OPT-SPDX-REL-COMMENT-LOST-001).'
    sourcePath: "relationships[?relationshipType not in ['DEPENDS_ON','DYNAMIC_LINK','STATIC_LINK','DEPENDENCY_OF','TEST_DEPENDENCY_OF','BUILD_DEPENDENCY_OF','DEV_DEPENDENCY_OF','OPTIONAL_DEPENDENCY_OF','PROVIDED_DEPENDENCY_OF','RUNTIME_DEPENDENCY_OF','CONTAINS','CONTAINED_BY','ANCESTOR_OF','DESCENDANT_OF','VARIANT_OF','DESCRIBES','DESCRIBED_BY']]"
    targetPath:
      - "components[].properties[]"
      - "metadata.component"
    cardinality: one-to-many
    transform:
      function: enumMap
      args:
        field: relationshipType
        table:
          COPY_OF: components[].properties[]
          PATCH_FOR: components[].properties[]
          DATA_FILE_OF: components[].properties[]
          OPTIONAL_COMPONENT_OF: components[].properties[]
          GENERATES: components[].properties[]
          FILE_ADDED: components[].properties[]
          REQUIREMENT_DESCRIPTION_FOR: components[].properties[]
          PREREQUISITE_FOR: components[].properties[]
          HAS_PREREQUISITE: components[].properties[]
          METAFILE_OF: components[].properties[]
          DEPENDENCY_MANIFEST_OF: components[].properties[]
          PATCH_APPLIED: components[].properties[]
          TEST_OF: components[].properties[]
          TEST_TOOL_OF: components[].properties[]
          SPECIFICATION_FOR: components[].properties[]
          FILE_MODIFIED: components[].properties[]
          DISTRIBUTION_ARTIFACT: components[].properties[]
          AMENDS: components[].properties[]
          DOCUMENTATION_OF: components[].properties[]
          GENERATED_FROM: components[].properties[]
          OTHER: components[].properties[]
          BUILD_TOOL_OF: components[].properties[]
          TEST_CASE_OF: components[].properties[]
          PACKAGE_OF: components[].properties[]
          FILE_DELETED: components[].properties[]
          EXPANDED_FROM_ARCHIVE: components[].properties[]
          DEV_TOOL_OF: components[].properties[]
          EXAMPLE_OF: components[].properties[]
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MINOR
    authority: spec
    xbucket: native
    xfieldsCovered: 1


  - ruleId: OPT-SPDX-REL-COMMENT-LOST-001
    description: '3.0.0 fix - the informal filter "not mapped above" replaced with an explicit not-in list. 3.0.2 - the dependency-like link/*_OF types were added to the not-in list now that they feed dependencies[].'
    sourcePath:
      - "relationships[].comment"
    targetPath: null
    cardinality: none
    transform: {function: identity}
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    lossReason: The SPDX relationship comments have no CycloneDX 1.6 model.
    xbucket: lost
    xfieldsCovered: 1    

  # ------------------------------------------------------------------
  # Extracted licensing info -> named licenses
  # (Option A split of OPT-SPDX-EXTRACTEDLIC-001)
  # ------------------------------------------------------------------
  - ruleId: OPT-SPDX-EXTRACTEDLIC-CORE-001
    description: Option A split. LicenseRef-* definitions become named CycloneDX licenses - licenseId -> bom-ref, name -> name, extractedText -> text.content.
    sourcePath:
      - "hasExtractedLicensingInfos[].name"
    targetPath: properties[]
    cardinality: one-to-many
    transform:
      function: template
      args: {name: "spdx:hasExtractedLicensingInfos:name", value: "{name}"}
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    xsplitGroup: extractedlic
    xbucket: native
    xfieldsCovered: 3

  - ruleId: OPT-SPDX-EXTRACTEDLIC-CORE-002
    description: Option A split. LicenseRef-* definitions become named CycloneDX licenses - licenseId -> bom-ref, name -> name, extractedText -> text.content.
    sourcePath:
      - "hasExtractedLicensingInfos[].extractedText"
    targetPath: properties[]
    cardinality: one-to-many
    transform:
      function: template
      args: {name: "spdx:hasExtractedLicensingInfos:extractedText",value: "{extractedText}"}
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MAJOR
    authority: spec
    xsplitGroup: extractedlic
    xbucket: native
    xfieldsCovered: 3

  - ruleId: OPT-SPDX-EXTRACTEDLIC-URL-001
    description: 'Option A split - replaces the pseudo call "firstOnly({seeAlsos}, {crossRefs[].url})". First seeAlso wins, else first crossRef url; extras TRUNCATED (CycloneDX license.url is single-valued).'
    sourcePath:
      - "hasExtractedLicensingInfos[].seeAlsos[]"
      - "hasExtractedLicensingInfos[].crossRefs[].url"
    targetPath: components[].licenses[].license.url
    cardinality: many-to-one
    transform: {function: firstOnly}
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MINOR
    authority: spec
    xsplitGroup: extractedlic
    xbucket: native
    xfieldsCovered: 2

  - ruleId: OPT-SPDX-EXTRACTEDLIC-COMMENT-DEGRADED-001
    description: 3.0.0 fix - licenseId added to sourcePath (the template referenced it undeclared; sibling-field defect).
    sourcePath:
      - "hasExtractedLicensingInfos[].licenseId"
      - "hasExtractedLicensingInfos[].comment"
    targetPath: properties[]
    cardinality: one-to-many
    transform:
      function: template
      args: {name: "spdx:license:{licenseId}:comment", value: "{comment}"}
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: MINOR
    authority: house-policy
    xbucket: degraded
    xfieldsCovered: 1

  - ruleId: OPT-SPDX-CROSSREF-META-LOST-001
    sourcePath:
      - "hasExtractedLicensingInfos[].crossRefs[].isLive"
      - "hasExtractedLicensingInfos[].crossRefs[].isValid"
      - "hasExtractedLicensingInfos[].crossRefs[].isWayBackLink"
      - "hasExtractedLicensingInfos[].crossRefs[].match"
      - "hasExtractedLicensingInfos[].crossRefs[].order"
      - "hasExtractedLicensingInfos[].crossRefs[].timestamp"
    targetPath: null
    cardinality: none
    transform: {function: identity}
    onAbsent: drop
    onUnmappable: annotate
    severityIfLost: INFORMATIONAL
    authority: spec
    lossReason: Cross-reference liveness metadata has no CycloneDX model.
    xbucket: lost
    xfieldsCovered: 6
conformance:
  failOnSeverity: [BLOCKER]
  warnOnSeverity: [MAJOR]
  reportOnSeverity: [MINOR, INFORMATIONAL]
lossReporting:
  enabled: true
  recordSourceValue: true
  recordTargetValue: true
  includeRuleId: true
  includeReason: true
  includeToolName: true
  includeToolVersion: true
  eventKinds: [DROPPED, TRUNCATED, MODIFIED, FABRICATED, REPARENTED, RENAMED]
